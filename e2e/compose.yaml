# Local sandbox: GitLab CE + runner + OCI registry, all on one network.
# Everything that talks to these services runs inside the network so that
# hostnames (gitlab:8929, registry:5001) are identical for every client.
name: ship-e2e

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    hostname: gitlab
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?run from e2e/ with .env}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab:8929'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD}'
        gitlab_rails['gitlab_signup_enabled'] = false
        registry['enable'] = false
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 10
    ports:
      - "8929:8929"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8929/-/readiness >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 180s

  registry:
    image: registry:3
    hostname: registry
    environment:
      REGISTRY_HTTP_ADDR: ":5001"
      REGISTRY_HTTP_DEBUG_ADDR: ":5002"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5001:5001"

  runner:
    image: gitlab/gitlab-runner:latest
    depends_on: [gitlab]
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

  # Management cluster for Promotion CRs (stands in for a platform-owned cluster;
  # never a Flux-managed target cluster).
  k3s:
    image: rancher/k3s:v1.33.1-k3s1
    hostname: k3s
    privileged: true
    command:
      - server
      - --disable=traefik,metrics-server,servicelb,local-storage
      - --tls-san=k3s
      - --write-kubeconfig=/output/kubeconfig.yaml
      - --write-kubeconfig-mode=644
    tmpfs: [/run, /var/run]
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./.kube:/output
    ports:
      - "6443:6443"

  # ship-controller; started by bootstrap.sh once tokens exist.
  controller:
    image: ship:dev
    profiles: [controller]
    depends_on: [k3s]
    env_file:
      - path: .state.env
        required: false
    environment:
      KUBECONFIG: /kube/config
      SHIP_GITLAB_URL: http://gitlab:8929
      SHIP_LEDGER_PROJECT: platform/ledger
      SHIP_INSECURE_REGISTRIES: registry:5001
      # SHIP_STATUS_CHECK_ID: external status checks need GitLab Ultimate (not CE)
    volumes:
      - ./.kube:/kube:ro
    command: ["sh", "-c", "SHIP_GITLAB_TOKEN=$$SHIPPROMOTER_TOKEN exec ship controller --poll 5s"]
    restart: unless-stopped

volumes:
  k3s-data:
  gitlab-config:
  gitlab-data:
  runner-config:

networks:
  default:
    name: ship-e2e
